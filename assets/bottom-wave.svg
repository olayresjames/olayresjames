<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Animated red closing wave</title>
  <desc id="desc">Layered glowing red waves closing the portfolio profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f001d"/><stop offset="0.52" stop-color="#260009"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff304f" stop-opacity="0"/><stop offset="0.5" stop-color="#ffb0ba"/><stop offset="1" stop-color="#ff304f" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ff304f" stroke-opacity="0.12"/></pattern>
    <clipPath id="clip"><rect width="1200" height="250" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)"><rect width="1200" height="250" fill="url(#bg)"/><rect width="1200" height="250" fill="url(#grid)"/>
    <g fill="none">
      <path d="M-60 95 C160 245 340 -10 570 120 S960 245 1260 72" stroke="#ff304f" stroke-opacity="0.42" stroke-width="2"><animate attributeName="d" dur="7s" repeatCount="indefinite" values="M-60 95 C160 245 340 -10 570 120 S960 245 1260 72;M-60 165 C160 -10 390 260 600 80 S980 -20 1260 150;M-60 95 C160 245 340 -10 570 120 S960 245 1260 72"/></path>
      <path d="M-60 150 C170 290 370 25 590 150 S970 270 1260 105" stroke="url(#line)" stroke-width="5" filter="url(#glow)"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M-60 150 C170 290 370 25 590 150 S970 270 1260 105;M-60 205 C160 10 380 300 610 100 S990 -10 1260 175;M-60 150 C170 290 370 25 590 150 S970 270 1260 105"/></path>
      <path d="M-60 205 C180 320 390 110 620 190 S980 320 1260 155" stroke="#ff8a9a" stroke-opacity="0.42"><animate attributeName="d" dur="5.5s" repeatCount="indefinite" values="M-60 205 C180 320 390 110 620 190 S980 320 1260 155;M-60 140 C170 330 390 60 620 220 S1000 20 1260 215;M-60 205 C180 320 390 110 620 190 S980 320 1260 155"/></path>
    </g>
    <g fill="#fff5f6" font-family="monospace" text-anchor="middle"><text x="600" y="104" font-size="15" letter-spacing="4">END OF FILE // KEEP BUILDING</text><text x="600" y="136" font-size="11" letter-spacing="2" fill="#ffb0ba">MADE WITH CURIOSITY · VALENZUELA CITY, PHILIPPINES</text></g>
  </g>
</svg>
