<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Rafhael James Olayres — digital builder</title>
  <desc id="desc">A dark red animated wave banner with a glowing grid and digital interface details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="0.52" stop-color="#160006"/><stop offset="1" stop-color="#8f001d"/></linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d90429" stop-opacity="0"/><stop offset="0.5" stop-color="#ff304f" stop-opacity="0.95"/><stop offset="1" stop-color="#d90429" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ff304f" stroke-opacity="0.12"/><circle cx="1" cy="1" r="1.2" fill="#ff8a9a" fill-opacity="0.45"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1010" cy="100" r="230" fill="#d90429" fill-opacity="0.13"/><circle cx="1010" cy="100" r="130" fill="#ff304f" fill-opacity="0.11"/>
    <g opacity="0.55" fill="none" stroke="#ff304f" stroke-width="1">
      <path d="M-40 300 C160 140 300 390 520 220 S890 80 1240 260" stroke-opacity="0.27"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M-40 300 C160 140 300 390 520 220 S890 80 1240 260;M-40 250 C190 380 330 80 540 260 S920 350 1240 150;M-40 300 C160 140 300 390 520 220 S890 80 1240 260"/></path>
      <path d="M-40 345 C150 200 330 420 545 270 S930 130 1240 300" stroke-opacity="0.42"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M-40 345 C150 200 330 420 545 270 S930 130 1240 300;M-40 270 C210 100 360 400 560 205 S970 350 1240 190;M-40 345 C150 200 330 420 545 270 S930 130 1240 300"/></path>
      <path d="M-40 380 C210 240 340 430 600 300 S960 180 1240 330" stroke="#ff8a9a" stroke-opacity="0.32" stroke-width="2"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M-40 380 C210 240 340 430 600 300 S960 180 1240 330;M-40 315 C180 430 410 170 610 340 S990 400 1240 240;M-40 380 C210 240 340 430 600 300 S960 180 1240 330"/></path>
    </g>
    <path d="M-80 355 C140 175 330 430 540 250 S930 120 1280 300" fill="none" stroke="url(#flare)" stroke-width="5" filter="url(#glow)"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M-80 355 C140 175 330 430 540 250 S930 120 1280 300;M-80 275 C170 420 350 120 560 290 S960 390 1280 180;M-80 355 C140 175 330 430 540 250 S930 120 1280 300"/></path>
    <g fill="#ff8a9a" font-family="monospace" letter-spacing="3"><text x="74" y="78" font-size="13">PORTFOLIO // 2026</text><text x="1010" y="78" font-size="13" text-anchor="end">SYSTEM ONLINE ●</text></g>
    <rect x="74" y="96" width="76" height="4" rx="2" fill="#ff304f"/>
    <text x="74" y="190" fill="#fff5f6" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="800" letter-spacing="-1">RAFHAEL JAMES</text>
    <text x="74" y="252" fill="#ff304f" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="800" letter-spacing="-1">OLAYRES</text>
    <text x="78" y="294" fill="#f8dfe3" font-family="monospace" font-size="16" letter-spacing="4">FULL-STACK  //  AI  //  GAME UI</text>
    <text x="78" y="352" fill="#ff8a9a" font-family="monospace" font-size="13">BUILDING USEFUL DIGITAL EXPERIENCES WITH INTENT</text>
    <g transform="translate(936 142)" fill="none" stroke="#ff8a9a" stroke-opacity="0.7"><rect width="188" height="118" rx="12" stroke-dasharray="4 7"/><path d="M22 30h144M22 56h90M22 82h138"/><circle cx="151" cy="56" r="13" stroke="#ff304f" stroke-width="3"><animate attributeName="r" values="10;15;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
