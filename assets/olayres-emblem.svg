<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Olayres James portfolio emblem</title>
  <desc id="desc">A redline monogram emblem combining the letters R, J, and O with orbital rings.</desc>
  <defs>
    <radialGradient id="core" cx="35%" cy="25%" r="80%"><stop stop-color="#3c0010"/><stop offset="0.65" stop-color="#120006"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb0ba"/><stop offset="0.35" stop-color="#ff304f"/><stop offset="1" stop-color="#8f001d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="160" cy="160" r="148" fill="#050505" stroke="#260009" stroke-width="8"/>
  <circle cx="160" cy="160" r="127" fill="url(#core)" stroke="url(#edge)" stroke-width="3"/>
  <ellipse cx="160" cy="160" rx="139" ry="54" fill="none" stroke="#ff304f" stroke-opacity="0.35" stroke-width="2" transform="rotate(-27 160 160)"/>
  <ellipse cx="160" cy="160" rx="139" ry="54" fill="none" stroke="#ff8a9a" stroke-opacity="0.22" stroke-width="2" transform="rotate(44 160 160)"/>
  <circle cx="61" cy="103" r="5" fill="#ffb0ba" filter="url(#glow)"/>
  <circle cx="255" cy="225" r="4" fill="#ff304f" filter="url(#glow)"/>
  <g fill="none" stroke="#fff5f6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 218V102h55c26 0 39 14 39 34s-13 34-39 34h-55m55 0 43 48"/>
